<style>
:root{
  --green:#16351F;
  --green-2:#1E4728;
  --green-3:#2E5E3C;
  --cream:#F7F4EC;
  --cream-2:#EFE9DC;
  --paper:#FFFFFF;
  --gold:#C9A961;
  --gold-2:#B8894A;
  --ink:#141813;
  --gray:#6E7168;
  --line:#E3DDCD;
  --shadow:0 20px 60px -20px rgba(22,53,31,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--cream);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.75;
}
.serif{font-family:'Noto Serif SC','Source Han Serif SC',serif}
.eng{font-family:'Cormorant Garamond','Times New Roman',serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit}

.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:22px 48px;display:flex;justify-content:space-between;align-items:center;
  transition:all .4s;
}
.nav.scrolled{background:rgba(247,244,236,.92);backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line);padding:14px 48px}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.15rem;letter-spacing:.18em;color:#fff;font-weight:600;line-height:1.1;transition:color .4s}
.nav.scrolled .nav-logo{color:var(--green)}
.nav-links{display:flex;gap:34px;align-items:center}
.nav-links a{font-size:.9rem;letter-spacing:.06em;color:rgba(255,255,255,.9);position:relative;padding:4px 0;transition:color .3s}
.nav.scrolled .nav-links a{color:var(--green)}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--gold);transition:width .3s}
.nav-links a:hover::after{width:100%}
.nav-burger{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#fff}

.hero{height:100vh;min-height:660px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;text-align:center}
.hero-bg{position:absolute;inset:0;background:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/RRrQb2NF4obJv4xYFrDcepv8nWc') center/cover no-repeat;animation:heroZoom 30s ease-in-out infinite alternate}
@keyframes heroZoom{0%{transform:scale(1.08)}100%{transform:scale(1.22)}}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,14,.5) 0%,rgba(10,25,14,.15) 45%,rgba(10,25,14,.72) 100%)}
.hero .glow{position:absolute;z-index:1;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,rgba(201,169,97,.14),transparent 62%);top:-18%;right:-12%;animation:glowDrift 20s ease-in-out infinite alternate}
@keyframes glowDrift{0%{transform:translate(0,0)}100%{transform:translate(-10%,14%)}}
.hero-inner{position:relative;z-index:2;padding:0 24px;max-width:900px}
.hero .kicker{font-family:'Cormorant Garamond',serif;font-size:1.05rem;letter-spacing:.45em;color:var(--gold);margin-bottom:26px}
.hero h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(2.9rem,7.5vw,5.6rem);line-height:1.08;margin-bottom:10px}
.hero h1 .cymru{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(2.1rem,5vw,3.8rem);color:var(--gold);margin-top:10px}
.hero p{font-size:1.1rem;font-weight:300;color:rgba(255,255,255,.92);max-width:560px;margin:22px auto 38px;line-height:1.9}
.hero .btn{display:inline-block;padding:17px 46px;background:var(--gold);color:var(--green);font-size:.95rem;letter-spacing:.12em;font-weight:600;border-radius:999px;transition:all .35s;cursor:pointer;border:none}
.hero .btn:hover{background:#fff;transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;color:rgba(255,255,255,.7);font-size:.75rem;letter-spacing:.25em}
.scroll-hint .line{width:1px;height:44px;background:rgba(255,255,255,.4);margin:0 auto 10px;animation:scrollLine 2s ease-in-out infinite}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.section{padding:110px 7%}
.wrap{max-width:1240px;margin:0 auto}
.eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--gold-2);letter-spacing:.22em;margin-bottom:16px;text-transform:uppercase}
.h2{font-family:'Noto Serif SC',serif;font-weight:700;font-size:clamp(2.1rem,4.2vw,3.2rem);line-height:1.22;color:var(--green);margin-bottom:22px}
.lead{font-size:1.08rem;line-height:2;color:var(--gray);font-weight:300;max-width:700px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:22px;overflow:hidden;margin-top:56px;border:1px solid var(--line)}
.stat{background:var(--paper);padding:46px 36px;text-align:center}
.stat .n{font-family:'Cormorant Garamond',serif;font-size:3.4rem;font-weight:700;color:var(--green);line-height:1}
.stat .l{font-size:.95rem;color:var(--gray);margin-top:10px}

.region-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:50px}
.region-card{position:relative;border-radius:22px;overflow:hidden;height:440px;cursor:pointer;display:block;transition:transform .5s,box-shadow .5s}
.region-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:cardKen 14s ease-in-out infinite alternate}
@keyframes cardKen{0%{transform:scale(1.02) translateX(0)}100%{transform:scale(1.12) translateX(-1.5%)}}
.region-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.region-card:hover::before{opacity:1}
.region-card::before{content:'';position:absolute;inset:0;z-index:2;border-radius:22px;border:1.5px solid rgba(201,169,97,.7);opacity:0;transition:opacity .4s;pointer-events:none}
.region-card .mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,14,.08) 40%,rgba(10,25,14,.78) 100%)}
.region-card .rc{position:absolute;left:34px;right:34px;bottom:30px;color:#fff}
.region-card .rc .en{font-size:.85rem;letter-spacing:.25em;color:var(--gold);margin-bottom:8px}
.region-card .rc h3{font-family:'Noto Serif SC',serif;font-size:2rem;font-weight:700}
.region-card .rc p{font-size:.92rem;color:rgba(255,255,255,.8);margin-top:8px;font-weight:300}
.region-card .count{position:absolute;top:26px;left:26px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);color:#fff;font-size:.78rem;padding:6px 14px;border-radius:999px;letter-spacing:.1em}

.spot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:48px}
.spot-card{background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px -12px rgba(22,53,31,.18);transition:transform .4s,box-shadow .4s;display:flex;flex-direction:column}
.spot-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.spot-card .ph{position:relative;height:240px;overflow:hidden}
.spot-card .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s ease}
.spot-card:hover .ph img{transform:scale(1.07)}
.spot-card .ph .tag{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.92);color:var(--green);font-size:.72rem;padding:5px 12px;border-radius:999px;letter-spacing:.05em}
.spot-card .bd{padding:24px 26px;flex:1;display:flex;flex-direction:column}
.spot-card .bd .en{font-size:.8rem;color:var(--gold-2);letter-spacing:.18em;margin-bottom:6px}
.spot-card .bd h4{font-family:'Noto Serif SC',serif;font-size:1.3rem;color:var(--green);font-weight:700}
.spot-card .bd p{font-size:.9rem;color:var(--gray);margin-top:10px;line-height:1.8;font-weight:300;flex:1}
.spot-card .bd .go{margin-top:16px;color:var(--green);font-size:.85rem;display:flex;align-items:center;gap:8px}
.spot-card .bd .go .arr{transition:transform .3s}
.spot-card:hover .bd .go .arr{transform:translateX(5px)}

.dark{background:var(--green);color:#fff;padding:115px 7%}
.dark .eyebrow{color:var(--gold)}
.dark h2{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(2.3rem,5vw,3.9rem);line-height:1.2;margin-bottom:28px}
.dark p{font-size:1.05rem;line-height:2;color:rgba(255,255,255,.8);max-width:700px;font-weight:300}

.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:48px}
.info-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:28px}
.info-card .ph{height:200px;border-radius:12px;overflow:hidden;margin-bottom:22px}
.info-card .ph img{width:100%;height:100%;object-fit:cover}
.info-card h4{font-family:'Noto Serif SC',serif;font-size:1.35rem;color:var(--gold);margin-bottom:10px}
.info-card p{font-size:.92rem;line-height:1.85;color:rgba(255,255,255,.78)}
.info-card a.more{display:inline-block;margin-top:14px;color:var(--gold);font-size:.85rem;border-bottom:1px solid rgba(201,169,97,.5);padding-bottom:3px}

.subhead{position:relative;height:62vh;min-height:460px;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.subhead .bg{position:absolute;inset:0;background-size:cover;background-position:center;animation:heroZoom 28s ease-in-out infinite alternate}
.subhead::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,14,.45) 0%,rgba(10,25,14,.1) 50%,rgba(10,25,14,.8) 100%)}
.subhead .wrap{position:relative;z-index:2;padding-bottom:48px;width:100%}
.crumb{font-size:.85rem;color:rgba(255,255,255,.8);margin-bottom:18px;letter-spacing:.05em}
.crumb a{color:var(--gold);border-bottom:1px solid rgba(201,169,97,.5)}
.subhead h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(2.4rem,5.5vw,4.2rem);line-height:1.1}
.subhead .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--gold);margin-top:6px;letter-spacing:.1em}

.detail{display:grid;grid-template-columns:1.6fr 1fr;gap:60px}
.detail .main p{font-size:1.05rem;line-height:2.1;color:#3A3D36;font-weight:300;margin-bottom:22px}
.detail .main h3{font-family:'Noto Serif SC',serif;font-size:1.5rem;color:var(--green);margin:38px 0 16px}
.detail .main blockquote{border-left:3px solid var(--gold);padding:6px 0 6px 24px;margin:28px 0;color:var(--green);font-family:'Noto Serif SC',serif;font-size:1.15rem;line-height:1.9}
.facts{background:var(--paper);border-radius:18px;padding:32px;box-shadow:0 8px 30px -14px rgba(22,53,31,.2);height:max-content;position:sticky;top:100px}
.facts h4{font-family:'Noto Serif SC',serif;color:var(--green);font-size:1.2rem;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.facts .row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.facts .row:last-child{border-bottom:none}
.facts .k{color:var(--gray);flex-shrink:0}
.facts .v{color:var(--ink);text-align:right;font-weight:500}
.facts .btn{display:block;margin-top:20px;text-align:center;padding:14px;background:var(--green);color:var(--gold);border-radius:12px;font-size:.9rem;cursor:pointer;border:none;width:100%}
.facts .btn:hover{background:var(--green-3)}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.gallery .g{height:170px;border-radius:14px;overflow:hidden}
.gallery .g img{width:100%;height:100%;object-fit:cover;transition:transform 1s}
.gallery .g:hover img{transform:scale(1.1)}

.nearby{margin-top:70px}
.nearby h3{font-family:'Noto Serif SC',serif;font-size:1.5rem;color:var(--green);margin-bottom:8px}
.back-btn{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;color:var(--green);font-size:.9rem;border-bottom:1px solid var(--green);padding-bottom:3px;cursor:pointer}

.pills{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.pill{padding:13px 26px;border:1.5px solid var(--green-3);border-radius:999px;color:var(--green);background:transparent;font-size:.92rem;cursor:pointer;transition:all .3s;display:inline-block}
.pill:hover,.pill.active{background:var(--green);color:#fff;border-color:var(--green)}

.safe-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}
.safe-card{position:relative;border-radius:16px;overflow:hidden;height:170px;display:flex;align-items:flex-end;padding:20px;color:#fff;text-decoration:none;cursor:pointer}
.safe-card .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s cubic-bezier(.2,.6,.2,1)}
.safe-card:hover .bg{transform:scale(1.12)}
.safe-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,14,.08),rgba(10,25,14,.72))}
.safe-card .lbl{position:relative;z-index:2;font-family:'Noto Serif SC',serif;font-size:1.15rem;font-weight:600}
.safe-card .sub{position:relative;z-index:2;font-size:.78rem;opacity:.88;margin-top:4px}
@media(max-width:700px){.safe-cards{grid-template-columns:1fr}}

.map-wrap{position:relative;background:linear-gradient(160deg,#EEF1E8,#E4E9DA);border-radius:24px;padding:36px 28px 28px;overflow:hidden;margin-top:50px}
.map-svg{width:100%;max-width:520px;margin:0 auto;display:block}
.map-land{fill:#CFD8C4;stroke:#A9B89B;stroke-width:1.5}
.map-sea{fill:#DCE5E0}
.map-pin{cursor:pointer}
.map-pin circle{stroke:#fff;stroke-width:2.2;transition:r .25s}
.map-pin:hover circle{r:10.5}
.map-pin text{font-family:'Noto Sans SC',sans-serif;font-size:11px;fill:var(--green);font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.map-pin:hover text{opacity:1}
.map-legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;justify-content:center;font-size:.85rem;color:var(--gray)}
.map-legend span{display:flex;align-items:center;gap:7px}
.map-legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

.alert{background:var(--green);color:#fff;border-radius:16px;padding:30px 34px;border-left:4px solid var(--gold);margin-top:24px}
.alert strong{color:var(--gold)}

.footer{background:var(--cream-2);padding:54px 7%;border-top:1px solid var(--line);font-size:.86rem;color:var(--gray)}
.footer .r{margin-bottom:10px}
.footer a{color:var(--green);border-bottom:1px solid var(--line)}

.to-top{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border-radius:50%;background:var(--green);color:var(--gold);border:none;cursor:pointer;font-size:17px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.to-top.show{opacity:1;pointer-events:auto}

.reveal{opacity:0;transform:translateY(44px);transition:opacity 1s ease,transform 1s cubic-bezier(.22,.61,.36,1)}
.reveal.in{opacity:1;transform:none}

@media(max-width:920px){
  .nav{padding:14px 20px}
  .nav.scrolled{padding:12px 20px}
  .nav-links{display:none;position:absolute;top:100%;right:0;left:0;flex-direction:column;background:var(--cream);padding:20px;gap:18px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
  .nav-links.open{display:flex}
  .nav-links a{color:var(--green)!important}
  .nav-burger{display:block;color:#fff}
  .nav.scrolled .nav-burger{color:var(--green)}
  .section{padding:70px 6%}
  .dark{padding:75px 6%}
  .stats{grid-template-columns:1fr}
  .region-grid{grid-template-columns:1fr}
  .region-card{height:380px}
  .spot-grid{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr;gap:30px}
  .facts{position:static}
  .gallery{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

  summary:'托马斯·特尔福德设计的悬索桥于 1826 年通车，是世界上最早的现代悬索桥之一，连接威尔士本土与安格尔西岛。',
  body:[
    '在悬索桥出现之前，从威尔士本土前往安格尔西岛只能依靠渡轮，风浪与潮汐常常让行程充满不确定性。19 世纪初，为了让都柏林与伦敦之间的交通更加顺畅，工程师托马斯·特尔福德受命在梅奈海峡上修建一座固定桥梁。',
    '他最终采用了大胆的悬索方案：16 条巨大的铁链从两岸石塔之间凌空跨过，桥面悬于海面之上，既不阻挡海峡中往来的高桅帆船，也能承受潮汐与风浪。1826 年桥梁通车时，它是当时世界上最长的悬索桥，被誉为工程奇迹。',
    '今天走近桥身，仍能看见整齐的石塔、锈迹斑斑的铁链与横跨海峡的优雅弧线。傍晚时分，桥身映在潮水与落日之间，是北威尔士最具代表性的画面之一。'
  ],
  quote:'"一座桥把孤岛变成了旅程的起点，也把一个时代的工程雄心，留在了海峡之上。"'},
 {id:'stack', region:'island', name:'南斯塔克灯塔', en:'South Stack Lighthouse', tag:'海岸灯塔', img:IMG.stack,
  facts:[['建成年代','1809 年'],['塔高','28 米'],['位置','霍利黑德岛外'],['登塔','约 400 级石阶']],
  summary:'白色灯塔矗立在霍利黑德岛外海的小岛上，与墨绿色海面、悬崖和海鸟构成安格尔西最经典的海岸画面。',
  body:[
    '南斯塔克灯塔坐落在安格尔西西北角一座被海水分隔的小岛上，1809 年建成，用来指引船只绕过这片暗礁密布的危险海域。灯塔通体洁白，塔楼、附属屋舍与跨海铁桥一起，构成一幅近乎电影画面的海岸图景。',
    '要走到灯塔脚下，需要沿崖壁盘旋而下约 400 级石阶，再跨过一座窄窄的铁桥。涨潮时小岛被海水环抱，风大时海浪拍击崖壁，能真切感受到灯塔守塔人曾经面对的孤独与壮阔。',
    '灯塔周围的悬崖也是海鸟的天堂，春夏时节可以看到海鹦、海鸦与三趾鸥在岩壁间筑巢。天气晴朗时，从崖顶远眺，爱尔兰海一直铺到天际。'
  ],
  quote:'"白色的塔身是给航海者的承诺：再凶险的海域，也有一盏灯为你而亮。"'},
 {id:'beaumaris', region:'island', name:'博马里斯城堡', en:'Beaumaris Castle', tag:'世界遗产', img:IMG.beaumaris,
  facts:[['始建','1295 年'],['始建者','爱德华一世'],['特点','同心防御布局'],['级别','UNESCO 世界遗产']],
  summary:'爱德华一世时期修建的城堡以规整的同心防御布局闻名，虽最终未完工，却留下宏大的石墙、塔楼与护城河。',
  body:[
    '博马里斯城堡是爱德华一世征服威尔士后修建的一系列城堡中最后、也是技术上最完美的一座。1295 年动工，由当时的首席建筑师詹姆斯·圣乔治主持，采用了极为规整的"同心防御"设计：外层城墙环绕内层城墙，护城河再环绕外墙，层层设防。',
    '城堡原本计划修建巨大的门楼与多座塔楼，但随着军费转向苏格兰战场，工程一再拖延，最终停在了近乎完工却未完工的状态。也正因如此，它保留了中世纪军事建筑最清晰的结构——沿城墙环行，能清楚读出每一道墙、每一座塔、每一道射孔的用途。',
    '城堡外护城河水波平静，倒映着圆形塔楼；城堡内侧是宽阔的草坪与石墙。1986 年，它作为"圭内斯爱德华一世时期的城堡与城墙"的一部分被列入世界遗产。'
  ],
  quote:'"它是一座没有完工的杰作，却因为未完成，反而让中世纪的军事秩序一览无余。"'},
 {id:'parys', region:'island', name:'帕里斯山', en:'Parys Mountain', tag:'铜矿遗迹', img:IMG.parys,
  facts:[['类型','露天铜矿遗迹'],['鼎盛','18 世纪后期'],['地貌','赭红、金黄与褐色'],['开放','公共步道免费']],
  summary:'这片露天矿区曾是世界重要的铜矿产区，五彩斑斓的矿迹与周围的海岸绿意形成超现实的对照。',
  body:[
    '帕里斯山位于安格尔西岛北部，看似一座普通的小山，走近却是一片赭红、金黄、紫褐与灰白交织的奇异地貌。这里的铜矿开采可以追溯到青铜时代，18 世纪后期更是一度成为世界上产量最大的铜矿之一。',
    '当时的矿工从地表向下挖开巨大的矿坑，铜矿被运到附近的阿姆卢赫港冶炼、装船，支撑起英国的航海与工业。随着矿脉枯竭，开采在 20 世纪初停止，留下一片被彻底重塑的山体。',
    '今天沿山上的公共步道行走，脚下是风化的矿渣与锈色的岩石，四周几乎没有树木，像是走进了另一个星球。这里也是地质与工业史爱好者的目的地，风吹过矿坑的声音，仿佛仍在讲述那段炽热的矿业岁月。'
  ],
  quote:'"人类把山挖空，又把它还给时间；剩下的颜色，成了大地自己的画。"'},
 {id:'conwy', region:'castles', name:'康威城堡', en:'Conwy Castle', tag:'中世纪城堡', img:IMG.conwy,
  facts:[['始建','1283 年'],['始建者','爱德华一世'],['特点','八座塔楼'],['级别','UNESCO 世界遗产']],
  summary:'康威城堡以八座高耸的塔楼横跨河口，是爱德华一世北威尔士城堡链中最具气势的一座。',
  body:[
    '康威城堡坐落在北威尔士康威河畔，1283 年由爱德华一世下令修建，是其征服威尔士后构建的"铁环"防御体系的核心。城堡八座巨大的塔楼沿河排列，石墙从岸边拔地而起，远远望去如同从山河之间长出来一般。',
    '城堡内部保存着中世纪皇家宫殿的遗迹，包括大厅、礼拜堂与王室居室。沿狭窄的螺旋阶梯登上塔顶，可以俯瞰康威河、海港以及横跨河流的现代桥梁，古老与现代在同一画面里相遇。',
    '城堡外的康威小城仍保留着完整的中世纪城墙，城墙总长约 1.3 公里，绕城一圈只需半个多小时，是体验中世纪城镇格局最好的方式之一。'
  ],
  quote:'"八座塔楼把一段征服史站成了风景，也把王权的重量砌进了石头。"'},
 {id:'david', region:'castles', name:'圣大卫大教堂', en:'St Davids Cathedral', tag:'圣城古教堂', img:IMG.david,
  facts:[['所在','圣大卫市'],['地位','英国最小城市'],['主保','圣大卫'],['特点','隐于山谷的古教堂']],
  summary:'圣大卫大教堂藏在英国最小城市的山谷里，是威尔士主保圣人圣大卫的安息之地，千年朝圣之路的终点。',
  body:[
    '威尔士最西端的圣大卫，人口不足两千，却是英国名义上最小的城市，因为它拥有一座大教堂。圣大卫是威尔士的主保圣人，公元 6 世纪在这里建立修道院，使此地成为威尔士最重要的朝圣中心。',
    '与许多宏伟教堂不同，圣大卫大教堂刻意建在山谷之中，从外面只能看到石塔与尖顶，走近才发现它静静卧在溪流与草地之间。教堂内部是诺曼式与哥特式交织的石柱、穹顶与圣坛，光线从高窗洒下，安静而庄严。',
    '教堂旁还保留着中世纪主教宫的废墟，紫色砂岩的残墙在夕阳下格外动人。如今的圣大卫也是徒步者前往彭布罗克海岸步道的重要起点，朝圣与旅行在这里延续。'
  ],
  quote:'"它不争高度，只把一千年的祈祷，安放在山谷与海风之间。"'},
 {id:'caernarfon', region:'castles', name:'卡那封城堡', en:'Caernarfon Castle', tag:'王者之城', img:IMG.caernarfon,
  facts:[['始建','1283 年'],['始建者','爱德华一世'],['特点','多边形塔楼与彩石墙'],['级别','UNESCO 世界遗产']],
  summary:'卡那封城堡以多边形石塔与彩石墙闻名，伫立在梅奈海峡畔，是爱德华一世"铁环"防御中最具王者气势的一座，也是历代威尔士亲王的册封之地。',
  body:[
    '卡那封城堡坐落在北威尔士梅奈海峡与塞翁特河交汇处，1283 年由爱德华一世下令修建。这里原本是罗马要塞与诺曼城堡的所在地，爱德华一世选址于此，意在把这座新镇牢牢控制在自己手中。',
    '与其他城堡不同，卡那封没有采用同心防御，而是沿河岸筑成一道绵延的石墙，配上一座座多边形塔楼。塔身由深浅不一的色石砌成，在阳光下泛出温润的纹理，据说这种设计是有意模仿君士坦丁堡的城墙，彰显王权的野心。',
    '这里也是王室记忆的所在：1969 年，查尔斯王子在此受封威尔士亲王，仪式的影像传遍世界。如今沿城墙与塔楼漫步，护城河外的港湾停泊着帆船，古堡的轮廓倒映在平静水面，是北威尔士最具代表性的画面之一。'
  ],
  quote:'"多边形的塔楼把一个王朝的野心砌进石头，也把加冕的荣光留在了海峡之畔。"'},
 {id:'snowdon', region:'mountains', name:'斯诺登尼亚', en:'Yr Wyddfa · Snowdonia', tag:'国家公园', img:IMG.snowdon,
  facts:[['类型','国家公园'],['最高峰','Yr Wyddfa 1085 米'],['登顶','小火车或徒步'],['语言','威尔士语核心区']],
  summary:'斯诺登尼亚是威尔士最壮阔的山地国家公园，峰峦、湖泊、石径与古老传说交织成一片凯尔特旷野。',
  body:[
    '斯诺登尼亚（威尔士语称 Eryri）位于威尔士西北部，是威尔士最早的国家公园，也是全英游客最多的国家公园之一。公园内最高峰 Yr Wyddfa（斯诺登山）海拔 1085 米，是威尔士的屋脊，云雾、湖泊与陡峭山脊构成其标志性的风景。',
    '登顶有两种方式：可以沿 Llanberis 小径等徒步路线攀爬，也可以搭乘已有百年历史的斯诺登山地小火车，缓缓穿过山谷直达山顶。山顶的游客中心与咖啡馆被称作"世界上最繁忙的山顶咖啡馆"。',
    '山脚下的 Llanberis 曾是石板矿业小镇，如今保留着矿山博物馆与宁静湖泊。这里也是威尔士语最活跃的地区之一，村中小酒馆、路标与孩童的对话里，仍能听见这门古老语言的呼吸。'
  ],
  quote:'"云落在山脊上，火车鸣笛穿过山谷，威尔士最古老的灵魂在高处。"'},
 {id:'sheep', region:'mountains', name:'山间牧道', en:'Mountain Pastures', tag:'乡野风景', img:IMG.sheep,
  facts:[['景观','牧羊山谷'],['常见','羊群与牧羊犬'],['特色','石砌农舍'],['最佳','春夏与初秋']],
  summary:'在斯诺登尼亚的山径上，牧羊人、牧羊犬与成群的绵羊是最生动的乡野风景，延续着数百年的山地生活。',
  body:[
    '威尔士的山地不只是风景，也是世代放牧的牧场。早在中世纪，这里的农人就开始在高山草甸放牧绵羊，羊毛与石板一起，构成了这片土地的经济根基。',
    '如今走在山间步道，常会遇到成群的绵羊占住小径，或者看见牧羊人带着牧羊犬在山坡上赶羊。牧羊犬听从一连串短促的哨声与口令，在乱石与草丛间奔跑，把羊群聚拢成一条移动的白色溪流。',
    '山谷里散落着石砌的农舍与篱笆，许多石头就地取材，与山岩几乎同色。对想要慢下来的旅行者，住进这样的山间农庄，看晨雾从草地升起，是理解威尔士最温柔的方式。'
  ],
  quote:'"山是牧场，云是邻居，牧羊犬的哨声是山谷里最古老的旋律。"'},
 {id:'cottage', region:'mountains', name:'斯诺登石屋', en:'Snowdonia Cottages', tag:'山居建筑', img:IMG.cottage,
  facts:[['材料','当地石板'],['特色','与山岩同色'],['用途','度假小屋'],['分布','山谷与湖畔']],
  summary:'斯诺登尼亚的石砌小屋用当地石板垒成，灰墙、陡坡屋顶与山间旷野融为一体，是威尔士山居美学的代表。',
  body:[
    '斯诺登尼亚多雨且多石，当地人便就地取材，用灰色的石板垒墙、铺顶，建起一座座与山岩几乎同色的小屋。厚厚的石墙抵御山风，陡斜的屋顶让雨水快速滑落，是山地生活智慧的结晶。',
    '这些小屋许多曾经是矿工、牧羊人的住所，如今被改造成度假屋，保留着低矮的木门、石砌壁炉与小格窗。屋外是连绵的草地、石墙与远处的峰峦。',
    '在光影变化下，石屋的灰色会随天气呈现出暖褐、青灰等不同色调。它不张扬，却代表了一种与自然共生的建筑哲学，也是威尔士乡村最动人的风景之一。'
  ],
  quote:'"石头从山里来，房子又回到山里，人居与旷野在此没有边界。"'},
 {id:'pembroke', region:'coast', name:'彭布罗克海岸', en:'Pembrokeshire Coast', tag:'国家公园', img:IMG.pembroke,
  facts:[['类型','海岸国家公园'],['步道','约 300 公里'],['特色','悬崖、海岬与海湾'],['观鸟','海鹦与海鸟']],
  summary:'彭布罗克海岸是英国唯一以海岸命名的国家公园，悬崖、海岬、蓝旗海滩与漫长步道勾勒出威尔士的西海岸。',
  body:[
    '彭布罗克海岸国家公园位于威尔士西南角，是英国唯一完全以海岸景观为主的国家公园。海岸线约 300 公里，悬崖、海蚀洞、沙滩与彩色小镇交替出现，曾被《国家地理》评为全球第二美的海岸目的地。',
    '彭布罗克海岸步道沿着崖顶蜿蜒，一面临海、一面临野，运气好时能看到海鹦、海豹与成群海鸟。徒步者可以分多日走完，也可以选择其中一段做半日轻徒步。',
    '沿线的小镇如 Tenby、St Davids 与 Solva 各具风情：Tenby 有彩色房屋与港湾沙滩，St Davids 是古老的圣城，Solva 则是藏在海湾里的小渔村。这里也是威尔士最适合夏季慢旅行的区域。'
  ],
  quote:'"海把崖壁雕成曲线，步道把人带到风里，西威尔士的蓝是会呼吸的。"'},
 {id:'cardiff', region:'coast', name:'加的夫', en:'Cardiff', tag:'首都', img:IMG.bay,
  facts:[['地位','威尔士首都'],['坐标','51.48°N, 3.18°W'],['语言','威尔士语与英语'],['特色','城堡、海湾与文化']],
  summary:'加的夫是威尔士的首都与门户，城堡、海湾、千年艺术中心与年轻氛围，让城市与海岸在慢旅行中相遇。',
  body:[
    '加的夫位于威尔士南部布里斯托尔湾畔，是威尔士的首都与最大城市，也是大多数旅行者认识威尔士的第一站。城市中心有两千年历史的加的夫城堡，城堡的罗马地基、诺曼塔楼与维多利亚装饰房间，浓缩了威尔士的多层历史。',
    '步行向南约两公里便到加的夫湾，曾经的煤炭出口码头如今被改造成滨水休闲区，标志性的红色 Pierhead 大楼、千年艺术中心与白色水镜喷泉构成城市新名片。',
    '加的夫也是一座年轻的大学城，市集、独立咖啡馆与威尔士语标识并存。从这里出发，无论是乘火车进入山谷，还是沿海岸向西，都能顺畅地把城市与山海连接起来。'
  ],
  quote:'"从一座城堡到一片海湾，加的夫把威尔士的过去与现在轻轻连在一起。"'},
 {id:'train', region:'coast', name:'窄轨蒸汽火车', en:'Heritage Railways', tag:'风景铁路', img:IMG.train,
  facts:[['代表','Talyllyn 等线路'],['始于','19 世纪'],['特色','窄轨蒸汽机车'],['体验','山谷与海岸慢车']],
  summary:'威尔士保留着多条百年窄轨蒸汽铁路，红色机车穿过山谷与海岸，把交通本身变成一段怀旧旅程。',
  body:[
    '工业时代的威尔士修建了大量窄轨铁路，用来把石板、煤炭与矿石从山区运到港口。随着公路兴起，这些铁路一度荒废，却被志愿者们一条条保留下来，成为今天的"活遗产"。',

function spotView(id){
  const s=getSpot(id);
  if(!s)return notFoundView();
  const r=getRegion(s.region);
  const facts=s.facts.map(f=>`<div class="row"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('');
  const body=s.body.map(p=>`<p>${p}</p>`).join('');
  const galleryPool = spotsInRegion(s.region).filter(x=>x.id!==s.id).slice(0,3);
  const gal = galleryPool.length? `<div class="gallery">${galleryPool.map(x=>`<a class="g" href="#/spot/${x.id}"><img src="${x.img}" alt="${x.name}"></a>`).join('')}</div>`:'';
  const crossPool = REGIONS.filter(rg=>rg.id!==s.region).map(rg=>spotsInRegion(rg.id)[0]).filter(Boolean).slice(0,3);
  const cross = crossPool.map(x=>`
    <a class="spot-card" href="#/spot/${x.id}">
      <div class="ph"><img src="${x.img}" alt="${x.name}"><span class="tag">${x.tag}</span></div>
      <div class="bd"><div class="en">${x.en}</div><h4 class="serif">${x.name}</h4><span class="go">查看详情 <span class="arr">→</span></span></div>
    </a>`).join('');
  return `
  <div class="view active" data-view="spot">
    <header class="subhead">
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="wrap">

function articleView(id){
  const a=ARTICLES[id];
  if(!a)return notFoundView();
  const facts=a.facts.map(f=>`<div class="row"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('');
  const paras=a.paras.map(p=>`<p>${p}</p>`).join('');
  const related=a.related.map(rid=>{
    const s=getSpot(rid);
    if(!s)return '';
    return `<a class="spot-card" href="#/spot/${s.id}"><div class="ph"><img src="${s.img}" alt="${s.name}"><span class="tag">${s.tag}</span></div><div class="bd"><div class="en">${s.en}</div><h4 class="serif">${s.name}</h4><span class="go">查看详情 <span class="arr">→</span></span></div></a>`;
  }).join('');
  const backHash=a.cat==='arrival'?'#/arrival':'#/safety';
  return `
  <div class="view active" data-view="article">
    <header class="subhead">
      <div class="bg" style="background-image:url('${a.img}')"></div>
      <div class="wrap">
        <div class="crumb"><a href="#/">首页</a> / <a href="${backHash}">${a.catName}</a> / ${a.title}</div>
        <h1 class="serif">${a.title}</h1>
        <div class="en">${a.en}</div>
      </div>
    </header>
    <section class="section">
      <div class="wrap">
        <a class="back-btn" href="${backHash}">← 返回${a.catName}</a>
        <div class="detail">
          <div class="main reveal">
            <p style="font-size:1.2rem;color:var(--green);font-weight:500;font-family:'Noto Serif SC',serif;line-height:1.9">${a.lead}</p>
            ${paras}
          </div>
          <aside class="facts reveal">
            <h4 class="serif">实用信息</h4>
            ${facts}
          </aside>
        </div>
        <div class="nearby reveal">
          <h3 class="serif">相关风景</h3>
          <div class="spot-grid">${related}</div>
        </div>
      </div>
    </section>
    ${footerHTML()}
  </div>`;
}

let pendingScroll=null;
function scrollToId(id){
  const t=document.getElementById(id);
  if(!t)return;
  const y=t.getBoundingClientRect().top+scrollY-72;
  scrollTo({top:y,behavior:'smooth'});
}
function render(){
  let hash=location.hash.replace(/^#/,'')||'/';
  let html;
  if(hash==='/'||hash==='') html=homeView();
  else if(hash.startsWith('/region/')) html=regionView(hash.split('/')[2]);
  else if(hash.startsWith('/spot/')) html=spotView(hash.split('/')[2]);
  else if(hash==='/arrival'||hash==='arrival') html=arrivalLanding();
  else if(hash.startsWith('/arrival/')) html=articleView(hash.split('/')[2]);
  else if(hash==='/safety'||hash==='safety') html=safetyLanding();
  else if(hash.startsWith('/safety/')) html=articleView(hash.split('/')[2]);
  else html=notFoundView();
  $app.innerHTML=navHTML()+html;
  bindCommon();
  window.scrollTo(0,0);
  observeReveals();
  if(pendingScroll){
    const target=pendingScroll;pendingScroll=null;
    requestAnimationFrame(()=>requestAnimationFrame(()=>scrollToId(target)));
  }
}

const ANCHOR_PAGE = {
  'from-uk':'/arrival','from-overseas':'/arrival','from-ireland':'/arrival','local-move':'/arrival','weather':'/arrival',
  'safety-mountain':'/safety','safety-coast':'/safety','safety-emergency':'/safety'
};
document.addEventListener('click',function(e){
  const a=e.target.closest('[data-scroll]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-scroll');
  const nl=document.getElementById('navLinks');if(nl)nl.classList.remove('open');
  if(document.getElementById(id)){ scrollToId(id); return; }
  const page=ANCHOR_PAGE[id]||'/';
  pendingScroll=id;
  location.hash='#'+page;
});

function bindCommon(){
  const nav=document.getElementById('nav');
  const burger=document.getElementById('burger');
  const navLinks=document.getElementById('navLinks');
  burger.addEventListener('click',()=>navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>navLinks.classList.remove('open')));
  window.addEventListener('scroll',function(){
    if(scrollY>60)nav.classList.add('scrolled');else nav.classList.remove('scrolled');
    const t=document.getElementById('toTop');
    if(scrollY>600)t.classList.add('show');else t.classList.remove('show');
  },{passive:true});
}
document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

let io;
function observeReveals(){
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add('in');
        e.target.querySelectorAll('[data-count]').forEach(function(el){
          if(el.dataset.done)return;
          el.dataset.done='1';
          const target=+el.dataset.count,suffix=el.dataset.suffix||'';
          const t0=performance.now();
          (function tick(t){
            const p=Math.min((t-t0)/1500,1);
            el.textContent=Math.floor(target*p)+suffix;
            if(p<1)requestAnimationFrame(tick);
          })(t0);
        });
      }else{
        e.target.classList.remove('in');
        e.target.querySelectorAll('[data-count]').forEach(el=>{delete el.dataset.done});
      }
    });
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

window.addEventListener('hashchange',render);
render();

window.addEventListener('scroll',function(){
  const inner=document.querySelector('.hero-inner');
  if(!inner)return;
  const y=scrollY;
  if(y<innerHeight){
    inner.style.transform='translateY('+(y*0.32)+'px)';
    inner.style.opacity=Math.max(1-y/(innerHeight*0.65),0);
    const hint=document.querySelector('.scroll-hint');
    if(hint)hint.style.opacity=Math.max(1-y/300,0);
  }
},{passive:true});
</script>
